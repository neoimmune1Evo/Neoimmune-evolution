          { id: "A", fraction: 0.50, color: "#1479d1", mutations: ["TP53 mutation (simulated)"], targets: { N1: 0.80, N2: 0.12, N3: 0.38, N4: 0.10, N5: 0.26, N6: 0.55 } },

          { id: "C", fraction: 0.20, color: "#d97706", mutations: ["RB1 loss (simulated)"], targets: { N1: 0.06, N2: 0.08, N3: 0.14, N4: 0.82, N5: 0.70, N6: 0.07 } }
        ],
        normalTissue: { N1: 0.09, N2: 0.17, N3: 0.14, N4: 0.11, N5: 0.58, N6: 0.10 }
      },
      {
        id: "LAML",
        name: "Acute Myeloid Leukemia",
        shortName: "Acute Myeloid Leukemia",
        category: "Blood cancer",
        commonGenes: ["FLT3", "NPM1", "DNMT3A", "IDH1", "IDH2"],
        clones: [
          { id: "A", fraction: 0.55, color: "#1479d1", mutations: ["NPM1 mutation (simulated)", "FLT3 mutation (simulated)"], targets: { N1: 0.82, N2: 0.65, N3: 0.12, N4: 0.10, N5: 0.25, N6: 0.60 } },
          { id: "B", fraction: 0.25, color: "#6e45cf", mutations: ["DNMT3A mutation (simulated)"], targets: { N1: 0.10, N2: 0.10, N3: 0.80, N4: 0.38, N5: 0.15, N6: 0.08 } },
          { id: "C", fraction: 0.20, color: "#d97706", mutations: ["IDH1 mutation (simulated)"], targets: { N1: 0.06, N2: 0.08, N3: 0.14, N4: 0.82, N5: 0.72, N6: 0.06 } }
        ],
        normalTissue: { N1: 0.10, N2: 0.18, N3: 0.15, N4: 0.12, N5: 0.57, N6: 0.10 }
      }
    ];

    const TARGET_IDS = ["N1", "N2", "N3", "N4", "N5", "N6"];

    const TARGET_BASE = {
      N1: { mutation: 0.85, rna: 0.72, hla: 0.75, immune: 0.65, uncertainty: 0.20 },
      N2: { mutation: 0.65, rna: 0.78, hla: 0.58, immune: 0.52, uncertainty: 0.30 },
      N3: { mutation: 0.55, rna: 0.63, hla: 0.48, immune: 0.42, uncertainty: 0.35 },
      N4: { mutation: 0.72, rna: 0.58, hla: 0.66, immune: 0.60, uncertainty: 0.25 },
      N5: { mutation: 0.32, rna: 0.42, hla: 0.36, immune: 0.30, uncertainty: 0.50 },
      N6: { mutation: 0.76, rna: 0.66, hla: 0.80, immune: 0.70, uncertainty: 0.16 }
    };

    const DEFAULT_RED_TEAM = {
      targetLoss: true,
      resistantExpansion: true,
      reducedHLA: false,
      antigenProcessing: false,
      immuneSuppression: false,
      newMutation: false,
      compensatoryPathway: false,
      highHeterogeneity: false
    };

    function clamp(value, min = 0, max = 1) {
      return Math.max(min, Math.min(max, value));
    }

    function weightedTumorExpression(cancer, target) {
      return cancer.clones.reduce(
        (sum, clone) => sum + clone.fraction * (clone.targets[target] || 0),
        0
      );
    }

    function cloneCoverage(clone, selectedTargets) {
      let missed = 1;

      selectedTargets.forEach(target => {
        missed *= 1 - (clone.targets[target] || 0);
      });

      return 1 - missed;
    }

    function overallCoverage(cancer, selectedTargets) {
      if (!selectedTargets.length) return 0;

      return cancer.clones.reduce(
        (sum, clone) => sum + clone.fraction * cloneCoverage(clone, selectedTargets),
        0
      );
    }

    function safetyStatus(cancer, target) {
      const tumor = weightedTumorExpression(cancer, target);
      const normal = cancer.normalTissue[target] || 0;
      const ratio = tumor / Math.max(normal, 0.01);

      if (normal > 0.45) return "Reject";
      if (ratio < 2) return "Uncertain";
      return "Accept";
    }

    function neoantigenScore(cancer, target) {
      const data = TARGET_BASE[target];
      const coverage = overallCoverage(cancer, [target]);
      const normalRisk = cancer.normalTissue[target] || 0;

      const score =
        0.20 * data.mutation +
        0.15 * data.rna +
        0.20 * data.hla +
        0.20 * coverage +
        0.15 * data.immune -
        0.20 * normalRisk -
        0.10 * data.uncertainty;

      return {
        target,
        mutation: data.mutation,
        rna: data.rna,
        hla: data.hla,
        immune: data.immune,
        uncertainty: data.uncertainty,
        coverage,
        normalRisk,
        score: clamp(score),
        safety: safetyStatus(cancer, target)
      };
    }

    function normalizeClones(clones) {
      const total = clones.reduce((sum, clone) => sum + clone.fraction, 0);

      return clones.map(clone => ({
        ...clone,
        fraction: clone.fraction / total
      }));
    }

    function addHighHeterogeneityClone(clones, active) {
      if (!active) return clones.map(clone => ({ ...clone }));

      const adjusted = clones.map(clone => ({
        ...clone,
        fraction: clone.fraction * 0.92
      }));

      adjusted.push({
        id: "D",
        fraction: 0.08,
        color: "#148a58",
        mutations: ["Minor resistant feature (simulated)"],
        targets: { N1: 0.05, N2: 0.05, N3: 0.05, N4: 0.10, N5: 0.15, N6: 0.75 }
      });

      return normalizeClones(adjusted);
    }

    function cloneFitness(clone, selectedTargets, options, step, index) {
      const coverage = cloneCoverage(clone, selectedTargets);
      let fitness = 1.12 - 0.82 * coverage;

      if (options.targetLoss && step >= 4 && index === 0 && coverage > 0.20) {
        fitness += 0.24;
      }

      if (options.resistantExpansion && coverage < 0.35) {
        fitness += 0.25;
      }

      if (options.reducedHLA && coverage > 0.20) {
        fitness += 0.17;
      }

      if (options.antigenProcessing && coverage > 0.20) {
        fitness += 0.13;
      }

      if (options.immuneSuppression && coverage > 0.20) {
        fitness += 0.15;
      }

      if (options.newMutation && step >= 6 && index === 2) {
        fitness += 0.18;
      }

      if (options.compensatoryPathway && step >= 5 && index === 1) {
        fitness += 0.18;
      }

      if (options.highHeterogeneity && clone.id === "D") {
        fitness += 0.22;
      }

      return Math.max(0.05, fitness);
    }

    function simulateEvolution(cancer, selectedTargets, options) {
      let clones = addHighHeterogeneityClone(cancer.clones, options.highHeterogeneity);

      const baseline = clones.map(clone => ({ ...clone }));
      const timeline = [];

      for (let time = 0; time <= 10; time++) {
        const row = { time: time === 0 ? "Baseline" : `T${time}` };

        clones.forEach(clone => {
          row[`Clone ${clone.id}`] = Number((clone.fraction * 100).toFixed(1));
        });

        timeline.push(row);

        if (time === 10) break;

        clones = clones.map((clone, index) => ({
          ...clone,
          fraction: clone.fraction * cloneFitness(clone, selectedTargets, options, time + 1, index)
        }));

        clones = normalizeClones(clones);
      }

      const finalClones = clones.map(clone => ({
        ...clone,
        percent: Number((clone.fraction * 100).toFixed(1))
      }));

      const dominant = [...finalClones].sort((a, b) => b.percent - a.percent)[0];

      return { baseline, timeline, finalClones, dominant };
    }

      const rows = useMemo(() => {

      const baselineCoverage = overallCoverage(cancer, selectedTargets);

              </div>

              <div className="mt-4 space-y-3 text-sm text-slate-700">
                <div>1. Compare new signals with baseline Digital Twin.</div>
                <div>2. Re-map clone composition and target coverage.</div>
                <div>3. Re-check normal-tissue risk and RNA/nanocarrier feasibility.</div>
                <div>4. Re-run the Therapeutic Red Team.</div>
                <div>5. Require validation again before any clinical consideration.</div>
              </div>

              <div className="mt-5 rounded-xl border border-purple-200 bg-purple-50 p-4 text-purple-900">
                <strong>Selected simulated RNA concept:</strong> {rnaType}<br />
                {potentialNewTarget ? (
                  <span className="text-sm">
                    <strong>Rule-based educational re-analysis:</strong> Clone {dominant.id} is modeled as
                    expressing {potentialNewTarget[0]}. A future research question could be whether adding
                    this candidate improves modeled coverage, followed by renewed safety filtering and Red-Team testing.
                  </span>
                ) : (
                  <span className="text-sm">
                    <strong>Rule-based educational re-analysis:</strong> Re-check target loss, antigen presentation,
                    delivery limitations, and alternate survival mechanisms.
                  </span>
                )}
              </div>
            </Panel>
          </div>

          <Panel tone="red">
            <h3 className="display-font text-xl font-bold text-slate-800">
              Final website statement
            </h3>

            <p className="mt-3 text-slate-700">
              NEOIMMUNE AI is a proposed research and decision-support framework. It is intended
              to integrate personalized tumor analysis, safety-oriented candidate prioritization,
              computational stress testing of therapeutic escape, independent validation, and
              longitudinal adaptation under qualified clinical, ethical, and regulatory oversight.
            </p>
          </Panel>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("home");
      const [cancerId, setCancerId] = useState("SKCM");
      const [search, setSearch] = useState("");
      const [selectedTargets, setSelectedTargets] = useState(["N1", "N3"]);
      const [redTeam, setRedTeam] = useState(DEFAULT_RED_TEAM);
      const [rnaType, setRnaType] = useState("mRNA vaccine concept");

      const cancer = useMemo(
        () => CANCER_DATABASE.find(item => item.id === cancerId) || CANCER_DATABASE[0],
        [cancerId]
      );

      const simulation = useMemo(
        () => simulateEvolution(cancer, selectedTargets, redTeam),
        [cancer, selectedTargets, redTeam]
      );

      function setCancerAndReset(newId) {
        setCancerId(newId);
        setSelectedTargets(["N1", "N3"]);
      }

      function toggleTarget(target) {
        setSelectedTargets(current => {
          if (current.includes(target)) {
            return current.filter(item => item !== target);
          }

          return [...current, target];
        });
      }

      function resetAll() {
        setCancerId("SKCM");
        setSearch("");
        setSelectedTargets(["N1", "N3"]);
        setRedTeam(DEFAULT_RED_TEAM);
        setRnaType("mRNA vaccine concept");
        setActiveTab("home");
      }

      const report = {
        generatedAt: new Date().toISOString(),
        disclaimer: "Simulated educational prototype only. Not patient data, medical advice, diagnosis, clinical prediction, validated neoantigen result, or treatment recommendation.",
        cancer: {
          id: cancer.id,
          name: cancer.name,
          category: cancer.category,
          commonGenes: cancer.commonGenes
        },
        selectedTargets,
        RNAConcept: rnaType,
        redTeamOptions: redTeam,
        simulatedBaselineClones: simulation.baseline.map(clone => ({
          id: clone.id,
          baselinePercent: Number((clone.fraction * 100).toFixed(1)),
          fictionalMolecularFeatures: clone.mutations,
          modeledTargetExpression: clone.targets
        })),
        finalSimulatedClones: simulation.finalClones.map(clone => ({
          id: clone.id,
          finalPercent: clone.percent,
          fictionalMolecularFeatures: clone.mutations,
          modeledTargetExpression: clone.targets
        })),
        finalDominantClone: {
          id: simulation.dominant.id,
          percent: simulation.dominant.percent
        },
        timeline: simulation.timeline
      };

      let page = null;

      if (activeTab === "home") {
        page = <HomePage setActiveTab={setActiveTab} />;
      } else if (activeTab === "cancer") {
        page = (
          <CancerExplorer
            cancer={cancer}
            setCancerId={setCancerAndReset}
            search={search}
            setSearch={setSearch}
          />
        );
      } else if (activeTab === "twin") {
        page = <DigitalTwin cancer={cancer} />;
      } else if (activeTab === "neo") {
        page = (
          <NeoantigenEvaluator
            cancer={cancer}
            selectedTargets={selectedTargets}
            toggleTarget={toggleTarget}
          />
        );
      } else if (activeTab === "rna") {
        page = <RNANanocarrier rnaType={rnaType} setRnaType={setRnaType} />;
      } else if (activeTab === "redteam") {
        page = (
          <RedTeam
            options={redTeam}
            setOptions={setRedTeam}
            cancer={cancer}
            selectedTargets={selectedTargets}
            simulation={simulation}
          />
        );
      } else if (activeTab === "evolution") {
        page = (
          <EvolutionSimulator
            cancer={cancer}
            simulation={simulation}
            selectedTargets={selectedTargets}
            options={redTeam}
          />
        );
      } else if (activeTab === "loop") {
        page = (
          <ClosedLoop
            cancer={cancer}
            selectedTargets={selectedTargets}
            simulation={simulation}
            rnaType={rnaType}
          />
        );
      } else {
        page = (
          <StrategyBuilder
            cancer={cancer}
            selectedTargets={selectedTargets}
            toggleTarget={toggleTarget}
            simulation={simulation}
          />
        );
      }

      return (
        <>
          <Header
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            resetAll={resetAll}
            report={report}
          />

          <main>{page}</main>

          <footer className="border-t border-slate-200 bg-white mt-8">
            <div className="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-slate-500">
              NEOIMMUNE AI Lab • Simulated research prototype • No patient data • No medical advice •
              Laboratory, clinical, ethical, and regulatory validation required
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
