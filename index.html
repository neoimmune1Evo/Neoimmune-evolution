/* =========================================================
   SIMULATED DEMO DATA — fixed, fictional, clearly labeled
   ========================================================= */
const TARGET_IDS = ["N1", "N2", "N3", "N4", "N5", "N6"];

const DEMO = {
  cancerType: "Melanoma (simulated demo case)",
  clones: [
    {
      id: "A", name: "Clone A", fraction: 0.50, color: "#60A5FA", resistant: false,
      mutations: ["BRAF V600E (simulated)", "CDKN2A loss (simulated)"],
      targets: { N1: 0.85, N2: 0.10, N3: 0.60, N4: 0.05, N5: 0.20, N6: 0.70 },
    },
    {
      id: "B", name: "Clone B", fraction: 0.30, color: "#C084FC", resistant: false,
      mutations: ["NRAS Q61K (simulated)", "PTEN loss (simulated)"],
      targets: { N1: 0.10, N2: 0.80, N3: 0.55, N4: 0.60, N5: 0.15, N6: 0.05 },
    },
    {
      id: "C", name: "Clone C", fraction: 0.20, color: "#FB923C", resistant: true,
      mutations: ["MITF-low dedifferentiated state (simulated)", "TP53 mutation (simulated)"],
      targets: { N1: 0.05, N2: 0.05, N3: 0.10, N4: 0.85, N5: 0.75, N6: 0.10 },
    },
  ],
  normalTissue: { N1: 0.05, N2: 0.20, N3: 0.15, N4: 0.10, N5: 0.60, N6: 0.08 },
};

const NEO_BASE = {
  N1: { label: "Candidate N1", mutationEvidence: 0.85, rnaExpression: 0.70, hlaPresentation: 0.75, immunogenicity: 0.65, uncertainty: 0.20 },
  N2: { label: "Candidate N2", mutationEvidence: 0.60, rnaExpression: 0.80, hlaPresentation: 0.55, immunogenicity: 0.50, uncertainty: 0.30 },
  N3: { label: "Candidate N3", mutationEvidence: 0.50, rnaExpression: 0.60, hlaPresentation: 0.45, immunogenicity: 0.40, uncertainty: 0.35 },
  N4: { label: "Candidate N4", mutationEvidence: 0.70, rnaExpression: 0.55, hlaPresentation: 0.65, immunogenicity: 0.60, uncertainty: 0.25 },
  N5: { label: "Candidate N5", mutationEvidence: 0.30, rnaExpression: 0.40, hlaPresentation: 0.35, immunogenicity: 0.30, uncertainty: 0.50 },
  N6: { label: "Candidate N6", mutationEvidence: 0.75, rnaExpression: 0.65, hlaPresentation: 0.80, immunogenicity: 0.70, uncertainty: 0.15 },
};

const RED_TEAM_DEFAULTS = {
  targetLoss: false,
  resistantExpansion: false,
  reducedPresentation: false,
  newMutation: false,
  compensatoryPathway: false,
};

const EVIDENCE_CATEGORIES = [
  { id: "target", title: "Target validation", items: ["Mutation confirmed in tumor sequencing (simulated)", "Target expression confirmed by RNA-seq (simulated)", "Independent cohort replication (simulated)"] },
  { id: "immune", title: "Immune validation", items: ["HLA presentation evidence reviewed (simulated)", "T-cell reactivity assay modeled (simulated)", "Immunogenicity scoring reviewed (simulated)"] },
  { id: "safety", title: "Normal-cell safety", items: ["Normal-tissue expression compared (simulated)", "Off-target binding risk reviewed (simulated)", "Safety filter classification recorded (simulated)"] },
  { id: "rna", title: "RNA validation", items: ["Transcript stability modeled (simulated)", "Expression consistency across samples (simulated)"] },
  { id: "nanocarrier", title: "Nanocarrier validation", items: ["Delivery vehicle stability modeled (simulated)", "Biodistribution assumptions documented (simulated)"] },
  { id: "preclinical", title: "Preclinical testing", items: ["In vitro model results reviewed (simulated)", "In vivo model results reviewed (simulated)"] },
  { id: "regulatory", title: "Clinical / ethical / regulatory review", items: ["Ethics board review documented (simulated)", "Regulatory pathway identified (simulated)", "Informed-consent framework reviewed (simulated)"] },
];

/* =========================================================
   PURE COMPUTATION HELPERS
   ========================================================= */
function tumorExpression(targetId) {
  return DEMO.clones.reduce((s, c) => s + c.fraction * (c.targets[targetId] || 0), 0);
}
function cloneCoverage(clone, targetIds) {
  let miss = 1;
  targetIds.forEach(t => { miss *= (1 - (clone.targets[t] || 0)); });
  return 1 - miss;
}
function overallCoverage(targetIds) {
  if (!targetIds.length) return 0;
  return DEMO.clones.reduce((s, c) => s + c.fraction * cloneCoverage(c, targetIds), 0);
}
function bestSingleTargetCoverage() {
  return Math.max(...TARGET_IDS.map(t => overallCoverage([t])));
}
function safetyClass(targetId) {
  const tumor = tumorExpression(targetId);
  const normal = DEMO.normalTissue[targetId];
  if (normal > 0.4) return "Reject";
  const ratio = tumor / Math.max(normal, 0.01);
  if (ratio < 2) return "Uncertain";
  return "Accept";
}
function neoScore(targetId) {
  const b = NEO_BASE[targetId];
  const coverage = overallCoverage([targetId]);
  const risk = DEMO.normalTissue[targetId];
  let score = 0.20 * b.mutationEvidence + 0.15 * b.rnaExpression + 0.20 * b.hlaPresentation
            + 0.20 * coverage + 0.15 * b.immunogenicity - 0.20 * risk - 0.10 * b.uncertainty;
  score = Math.max(0, Math.min(1, score));
  return { id: targetId, ...b, coverage, risk, score, safety: safetyClass(targetId) };
}
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    <div className={`bg-navy-900/70 border rounded-xl p-6 ${glow} ${className}`}>{children}</div>
  );
}
function Pill({ children, tone = "slate" }) {
  const cls = { blue: "bg-blue-500/15 text-blue-300 border-blue-500/40",
    purple: "bg-purple-500/15 text-purple-300 border-purple-500/40",

function Bar({ label, value, tone = "blue", suffix = "%" }) {

        <div className="h-full rounded-full transition-all duration-500" style={{ width: `${value * 100}%`, background: color }} />

}
const DISCLAIMER = "Research and educational prototype only. This tool does not provide medical advice or treatment recommendations.";

/* =========================================================
   HOME PAGE — closed loop flowchart
   ========================================================= */
const FLOW_STEPS = [
  "Patient Data", "Tumor Mapper", "Digital Twin", "Neoantigen Evaluation", "Safety Filter",
  "Multi-Target Strategy", "Therapeutic Red Team", "Validation Gate", "Monitoring", "Updated Digital Twin",
];
function FlowChart() {
  const row1 = FLOW_STEPS.slice(0, 5);
  const row2 = FLOW_STEPS.slice(5);
  const boxTone = (i) => {
    const idx = i;
    if (idx === 1 || idx === 2 || idx === 3 || idx === 9) return "blue";
    if (idx === 4) return "green";
    if (idx === 5) return "orange";
    if (idx === 6) return "red";
    return "slate";
  };
  const Box = ({ label, idx }) => {
    const tone = boxTone(idx);
    const cls = { blue: "border-blue-500/40 text-blue-300", green: "border-green-500/40 text-green-300",
      orange: "border-orange-500/40 text-orange-300", red: "border-red-500/40 text-red-300",
      slate: "border-slate-600/50 text-slate-300" }[tone];
    return (
      <div className={`bg-navy-900 border rounded-lg px-3 py-3 text-center text-sm ${cls}`} style={{ minWidth: 130 }}>
        {label}
      </div>
    );
  };
  return (
    <div className="space-y-3">
      <div className="flex flex-wrap items-center gap-2">
        {row1.map((s, i) => (
          <React.Fragment key={s}>
            <Box label={s} idx={i} />
            {i < row1.length - 1 && <span className="text-slate-600">→</span>}
          </React.Fragment>
        ))}
      </div>
      <div className="flex flex-wrap items-center gap-2">
        {row2.map((s, i) => (
          <React.Fragment key={s}>
            <Box label={s} idx={i + 5} />
            {i < row2.length - 1 && <span className="text-slate-600">→</span>}
          </React.Fragment>
        ))}
      </div>
      <div className="text-slate-500 text-sm flex items-center gap-2 pt-1">
        <span>↻</span><span>Updated Digital Twin feeds back into Tumor Mapper — the loop closes as new monitoring data arrives.</span>
      </div>
    </div>
  );
}
function HomePage() {

    </div>
  );
}

  return (

      <SectionTitle eyebrow="stage 1" title="Tumor Mapper"

        <Panel tone="blue">
          <h3 className="disp text-slate-100 mb-3">Clone lineage tree (simulated)</h3>
          <svg viewBox="0 0 320 220" className="w-full">
            <path d="M20 200 C 50 175, 70 160, 100 145" fill="none" stroke="#334155" strokeWidth="2" />
            <path d="M100 145 C 130 128, 150 112, 180 95" fill="none" stroke={hovered === "A" ? "#60A5FA" : "#334155"} strokeWidth={hovered === "A" ? 3 : 2} />
            <path d="M100 145 C 120 165, 140 178, 170 195" fill="none" stroke={hovered === "B" ? "#C084FC" : "#334155"} strokeWidth={hovered === "B" ? 3 : 2} />
            <path d="M180 95 C 205 82, 225 70, 250 55" fill="none" stroke={hovered === "C" ? "#FB923C" : "#334155"} strokeWidth={hovered === "C" ? 3 : 2} />
            <circle cx="20" cy="200" r="6" fill="#070B14" stroke="#94A3B8" strokeWidth="2" />
            <circle cx="100"
