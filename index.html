    const TARGET_META = {
      N1: { mutation: 0.85, rna: 0.72, hla: 0.76, immune: 0.66, uncertainty: 0.20 },
      N2: { mutation: 0.68, rna: 0.78, hla: 0.58, immune: 0.52, uncertainty: 0.28 },
      N3: { mutation: 0.55, rna: 0.62, hla: 0.48, immune: 0.44, uncertainty: 0.34 },
      N4: { mutation: 0.74, rna: 0.56, hla: 0.67, immune: 0.61, uncertainty: 0.24 },
      N5: { mutation: 0.35, rna: 0.42, hla: 0.36, immune: 0.31, uncertainty: 0.50 }
    };

    function cloneCoverage(clone, selectedTargets) {
      if (!selectedTargets.length) return 0;
      let notCovered = 1;
      selectedTargets.forEach(target => {
        notCovered *= 1 - (clone.targets[target] || 0);
      });
      return 1 - notCovered;
    }

    function totalCoverage(clones, selectedTargets) {
      return clones.reduce(
        (sum, clone) => sum + clone.fraction * cloneCoverage(clone, selectedTargets),
        0
      );
    }

    function tumorExpression(clones, target) {
      return clones.reduce(
        (sum, clone) => sum + clone.fraction * (clone.targets[target] || 0),
        0
      );
    }

    function safetyStatus(cancer, target) {
      const tumor = tumorExpression(cancer.clones, target);
      const normal = cancer.normal[target] || 0;
      const ratio = tumor / Math.max(normal, 0.01);

      if (normal > 0.45) return "Reject";
      if (ratio < 2) return "Uncertain";
      return "Accept";
    }

    function calculateTargetScore(cancer, target) {
      const meta = TARGET_META[target];
      const coverage = totalCoverage(cancer.clones, [target]);
      const normalRisk = cancer.normal[target] || 0;

      let score =
        0.20 * meta.mutation +
        0.15 * meta.rna +
        0.20 * meta.hla +
        0.20 * coverage +
        0.15 * meta.immune -
        0.20 * normalRisk -
        0.10 * meta.uncertainty;

      score = Math.max(0, Math.min(1, score));

      return {
        target,
        coverage,
        normalRisk,
        score,
        status: safetyStatus(cancer, target),
        ...meta
      };
    }

    function normalizeFractions(clones) {
      const total = clones.reduce((sum, clone) => sum + clone.fraction, 0);
      return clones.map(clone => ({
        ...clone,
        fraction: clone.fraction / total
      }));
    }

    function simulateEvolution(cancer, selectedTargets, escape, rnaType, carrierType) {
      let clones = cancer.clones.map(clone => ({ ...clone }));
      const timeline = [];

      for (let time = 0; time <= 10; time++) {
        timeline.push({
          time: `T${time}`,
          A: +(clones.find(c => c.id === "A")?.fraction || 0).toFixed(4),
          B: +(clones.find(c => c.id === "B")?.fraction || 0).toFixed(4),
          C: +(clones.find(c => c.id === "C")?.fraction || 0).toFixed(4),
          D: +(clones.find(c => c.id === "D")?.fraction || 0).toFixed(4)
        });

        if (time === 10) break;

        clones = clones.map((clone, index) => {
          const coverage = cloneCoverage(clone, selectedTargets);
          let fitness = 1.0 - 0.55 * coverage;

          if (escape.targetLoss && time >= 3 && index === 0) fitness += 0.22;
          if (escape.resistantExpansion && coverage < 0.35) fitness += 0.25;
          if (escape.reducedPresentation) fitness += 0.14 * coverage;
          if (escape.antigenProcessingDefect) fitness += 0.11 * coverage;
          if (escape.immuneSuppression) fitness += 0.12 * coverage;
          if (escape.newMutation && time >= 5 && index === 2) fitness += 0.20;
          if (escape.compensatoryPathway && index === 1) fitness += 0.14;

          if (rnaType === "mRNA vaccine concept") fitness -= 0.04 * coverage;
          if (rnaType === "siRNA concept") fitness -= 0.03 * coverage;
          if (carrierType === "Lipid nanoparticle concept") fitness -= 0.02 * coverage;

          return {
            ...clone,
            fraction: Math.max(0.001, clone.fraction * Math.max(0.05, fitness))
          };
        });

        clones = normalizeFractions(clones);
      }

      const final = timeline[timeline.length - 1];
      const finalClones = ["A", "B", "C", "D"]
        .filter(id => final[id] > 0)
        .map(id => ({ id, fraction: final[id] }))
        .sort((a, b) => b.fraction - a.fraction);

      const dominant = finalClones[0];
      const coverage = totalCoverage(cancer.clones, selectedTargets);
      const activeEscapeCount = Object.values(escape).filter(Boolean).length;

      let risk = "Low";
      if (coverage < 0.90 || activeEscapeCount >= 2 || dominant.fraction > 0.50) risk = "Moderate";
      if (coverage < 0.70 || dominant.fraction > 0.68 || selectedTargets.length === 0) risk = "High";

      return {
        timeline,
        finalClones,
        dominant,
        baselineCoverage: coverage,
        risk
      };
    }

    function Controls({

                    }`}

                    <input

    function Tumor3DView({ simulation, activeTime, setActiveTime }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const animationRef = useRef(null);
      const [playing, setPlaying] = useState(false);

      useEffect(() => {
        if (!mountRef.current || !window.THREE) return;

        const THREE = window.THREE;
        const mount = mountRef.current;
        const width = mount.clientWidth;
        const height = 440;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#f8fbff");

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 17);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        mount.innerHTML = "";
        mount.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambient);

        const light = new THREE.DirectionalLight(0xffffff, 1.1);
        light.position.set(7, 8, 10);
        scene.add(light);

        const tumorShell = new THREE.Mesh(
          new THREE.SphereGeometry(5.9, 48, 48),
          new THREE.MeshPhongMaterial({
            color: 0x7cb9ff,
            transparent: true,
            opacity: 0.09,
            side: THREE.DoubleSide
          })
        );
        scene.add(tumorShell);

        const wireframe = new THREE.Mesh(
          new THREE.SphereGeometry(5.93, 28, 28),
          new THREE.MeshBasicMaterial({
            color: 0x5ea4e7,
            wireframe: true,
            transparent: true,
            opacity: 0.18
          })
        );
        scene.add(wireframe);

        const cellGroup = new THREE.Group();
        scene.add(cellGroup);

        const particleGroup = new THREE.Group();
        scene.add(particleGroup);

        sceneRef.current = {
          THREE,
          scene,
          camera,
          renderer,
          tumorShell,
          wireframe,
          cellGroup,
          particleGroup
        };

        const animate = () => {
          animationRef.current = requestAnimationFrame(animate);
          tumorShell.rotation.y += 0.0015;
          wireframe.rotation.y += 0.0015;
          cellGroup.rotation.y += 0.0008;
          renderer.render(scene, camera);
        };

        animate();

        const resize = () => {
          const nextWidth = mount.clientWidth;
          camera.aspect = nextWidth / height;
          camera.updateProjectionMatrix();
          renderer.setSize(nextWidth, height);
        };

        window.addEventListener("resize", resize);

        return () => {
          window.removeEventListener("resize", resize);
          cancelAnimationFrame(animationRef.current);
          renderer.dispose();
          mount.innerHTML = "";
        };
      }, []);

      useEffect(() => {
        if (!sceneRef.current) return;

        const { THREE, cellGroup, particleGroup } = sceneRef.current;
        const point = simulation.timeline[activeTime];

        while (cellGroup.children.length) {
          const child = cellGroup.children.pop();
          child.geometry?.dispose();
          child.material?.dispose();
        }

        while (particleGroup.children.length) {
          const child = particleGroup.children.pop();
          child.geometry?.dispose();
          child.material?.dispose();
        }

        const configs = [
          { id: "A", color: 0x1479d1 },
          { id: "B", color: 0x6e45cf },
          { id: "C", color: 0xd97706 },
          { id: "D", color: 0x148a58 }
        ];

        const totalCells = 300;

        configs.forEach(config => {
          const fraction = point[config.id] || 0;
          const count = Math.round(totalCells * fraction);

          const geometry = new THREE.SphereGeometry(0.12, 10, 10);
          const material = new THREE.MeshPhongMaterial({
            color: config.color,
            shininess: 60
          });

          for (let i = 0; i < count; i++) {
            const cell = new THREE.Mesh(geometry, material);
            let x, y, z, distance;

            do {
              x = (Math.random() * 2 - 1) * 5.4;
              y = (Math.random() * 2 - 1) * 5.4;
              z = (Math.random() * 2 - 1) * 5.4;
              distance = Math.sqrt(x * x + y * y + z * z);
            } while (distance > 5.5);

            cell.position.set(x, y, z);
            cellGroup.add(cell);
          }
        });

        const particleGeometry = new THREE.SphereGeometry(0.06, 8, 8);
        const particleMaterial = new THREE.MeshPhongMaterial({
          color: 0x9b6cff,
          emissive: 0x3b1568,
          shininess: 80
        });

        for (let i = 0; i < 55; i++) {
          const particle = new THREE.Mesh(particleGeometry, particleMaterial);
          particle.position.set(
            (Math.random() * 2 - 1) * 7,
            (Math.random() * 2 - 1) * 5,
            (Math.random() * 2 - 1) * 5
          );
          particleGroup.add(particle);
        }
      }, [simulation, activeTime]);

      useEffect(() => {
        if (!playing) return;

        const timer = setInterval(() => {
          setActiveTime(previous => {
            if (previous >= 10) {
              setPlaying(false);
              return 10;
            }
            return previous + 1;
          });
        }, 850);

        return () => clearInterval(timer);
      }, [playing, setActiveTime]);

      const point = simulation.timeline[activeTime];

      return (
        <Panel tone="purple">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="display text-xl font-semibold text-slate-900">3D Tumor Evolution View</h2>
              <p className="mt-1 text-sm text-slate-600">
                Colored spheres represent simulated cell clones inside an illustrative tumor volume.
              </p>
            </div>
            <Badge tone="red">Not patient imaging</Badge>
          </div>

          <div className="mt-4 flex flex-wrap gap-2">
            <Badge tone="blue">Blue: Clone A</Badge>
            <Badge tone="purple">Purple: Clone B</Badge>
            <Badge tone="orange">Orange: Clone C</Badge>
            <Badge tone="green">Green: Clone D</Badge>
            <Badge tone="slate">Purple particles: illustrative nanocarriers</Badge>
          </div>

          <div
            ref={mountRef}
            className="mt-5 overflow-hidden rounded-2xl border border-purple-200 bg-slate-50"
            style={{ height: "440px" }}
          />

          <div className="mt-5 grid gap-4 md:grid-cols-[1fr_auto] md:items-center">
            <input
              type="range"
              min="0"
              max="10"
              value={activeTime}
              onChange={event => {
                setPlaying(false);
                setActiveTime(Number(event.target.value));
              }}
              className="w-full"
            />

            <div className="flex gap-2">
              <button
                onClick={() => setPlaying(value => !value)}
                className="rounded-xl bg-purple-600 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-700"
              >
                {playing ? "Pause" : "Play"}
              </button>

              <button
                onClick={() => {
                  setPlaying(false);
                  setActiveTime(0);
                }}
                className="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
              >
                Reset
              </button>
            </div>
          </div>

          <div className="mt-4 grid gap-3 md:grid-cols-4">
            {["A", "B", "C", "D"].map(id => (
              <div key={id} className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                <div className="text-xs text-slate-500">Clone {id} at T{activeTime}</div>
                <div className="mono mt-1 text-lg font-semibold" style={{ color: CLONE_COLORS[id] }}>
                  {Math.round((point[id] || 0) * 100)}%
                </div>
              </div>
            ))}
          </div>

          <div className="mt-4 rounded-xl border-l-4 border-amber-500 bg-amber-50 p-4 text-sm text-amber-900">
            <strong>Interpretation:</strong> This 3D scene illustrates possible changes in clone abundance under selected
            simulation rules. It is not a tumor scan, tissue reconstruction, spatial biopsy, molecular docking result,
            real nanocarrier tracking result, or prediction of an individual patient’s tumor.
          </div>
        </Panel>
      );
    }

    function ClosedLoop({ simulation, cancer, selectedTargets, setSelectedTargets }) {
      const dominantClone = cancer.clones.find(clone => clone.id === simulation.dominant.id);
      const suggestedTarget = dominantClone?.targets
        ? Object.entries(dominantClone.targets)

            .sort((a, b) => b[1] - a[1])[0]?.[0]

      return (

                The simulation cannot approve treatment. All paths stop here until independent evidence exists.
              </p>
            </div>
            <Badge tone="red">AI cannot pass this gate alone</Badge>
          </div>

          <div className="mt-5 grid gap-3 md:grid-cols-2 lg:grid-cols-3">
            {[
              "Target mutation and expression confirmation",
              "HLA / antigen-presentation investigation",
              "Immune-recognition evaluation where relevant",
              "Normal-cell and normal-tissue safety testing",
              "RNA cargo and nanocarrier validation",
              "Appropriate preclinical evaluation",
              "Clinical expert review",
              "Ethical and regulatory review",
              "Informed consent and clinical research pathway"
            ].map(item => (
              <div key={item} className="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-900">
                ✓ {item}
              </div>
            ))}
          </div>
        </Panel>
      );
    }

    function MonitoringPanel() {
      return (
        <Panel tone="blue">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 className="display text-xl font-semibold text-slate-900">Monitoring Inputs for a Future Research Workflow</h2>
              <p className="mt-1 text-sm text-slate-600">
                This prototype does not collect patient data. These are example categories that could inform a future Digital Twin update.
              </p>
            </div>
            <Badge tone="blue">No patient upload</Badge>
          </div>

          <div className="mt-5 grid gap-3 md:grid-cols-2 lg:grid-cols-4">
            {[
              ["Clinical assessment", "Symptoms, physical findings, and clinician-led evaluation."],
              ["Imaging", "Imaging results when clinically appropriate."],
              ["ctDNA / liquid biopsy", "Potential molecular-monitoring context when appropriate."],
              ["Repeat molecular testing", "New sequencing or molecular information when indicated."]
            ].map(([title, description]) => (
              <div key={title} className="rounded-xl border border-blue-200 bg-blue-50 p-4">
                <div className="display font-semibold text-blue-950">{title}</div>
                <p className="mt-1 text-sm text-blue-900">{description}</p>
              </div>
            ))}
          </div>

          <div className="mt-4 rounded-xl border-l-4 border-blue-500 bg-blue-50 p-4 text-sm text-blue-900">
            If new evidence suggests recurrence, resistance, or tumor evolution, a future approved research pipeline
            could update the computational representation and repeat target prioritization, safety assessment,
            red-team testing, validation, and clinical review.
          </div>
        </Panel>
      );
    }

    function App() {
      const [cancer, setCancer] = useState(CANCER_DATABASE[0]);
      const [selectedTargets, setSelectedTargets] = useState(["N1", "N3"]);
      const [rnaType, setRnaType] = useState("mRNA vaccine concept");
      const [carrierType, setCarrierType] = useState("Lipid nanoparticle concept");
      const [escape, setEscape] = useState({
        targetLoss: true,
        resistantExpansion: true,
        reducedPresentation: false,
        antigenProcessingDefect: false,
        immuneSuppression: false,
        newMutation: false,
        compensatoryPathway: false
      });
      const [runVersion, setRunVersion] = useState(1);
      const [activeTime, setActiveTime] = useState(0);

      const simulation = useMemo(
        () => simulateEvolution(cancer, selectedTargets, escape, rnaType, carrierType),
        [cancer, selectedTargets, escape, rnaType, carrierType, runVersion]
      );

      useEffect(() => {
        setActiveTime(0);
      }, [cancer, selectedTargets, escape, rnaType, carrierType, runVersion]);

      const downloadReport = () => {
        const report = {
          generatedAt: new Date().toISOString(),
          disclaimer: DISCLAIMER,
          modelType: "Educational simulated closed-loop cancer-evolution prototype",
          cancerContext: {
            id: cancer.id,
            name: cancer.fullName,
            exampleGenes: cancer.genes
          },
          selectedTargets,
          selectedRNAConcept: rnaType,
          selectedNanocarrierConcept: carrierType,
          escapeScenarios: escape,
          baselineCoveragePercent: +(simulation.baselineCoverage * 100).toFixed(1),
          modeledRisk: simulation.risk,
          finalDominantModeledClone: {
            id: simulation.dominant.id,
            percent: +(simulation.dominant.fraction * 100).toFixed(1)
          },
          evolutionTimeline: simulation.timeline
        };

        const blob = new Blob([JSON.stringify(report, null, 2)], {
          type: "application/json"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `neoimmune-ai-${cancer.id}-simulation.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      return (
        <>
          <Header />

          <main className="mx-auto max-w-7xl space-y-7 px-4 py-7 md:px-6">
            <Controls
              cancer={cancer}
              setCancer={setCancer}
              selectedTargets={selectedTargets}
              setSelectedTargets={setSelectedTargets}
              rnaType={rnaType}
              setRnaType={setRnaType}
              carrierType={carrierType}
              setCarrierType={setCarrierType}
              escape={escape}
              setEscape={setEscape}
              runVersion={runVersion}
              setRunVersion={setRunVersion}
            />

            <div className="grid gap-7 lg:grid-cols-2">
              <TumorMapper cancer={cancer} />
              <NeoantigenResults cancer={cancer} />
            </div>

            <RNANanocarrierResults
              rnaType={rnaType}
              carrierType={carrierType}
            />

            <RedTeamResults
              escape={escape}
              simulation={simulation}
              cancer={cancer}
              selectedTargets={selectedTargets}
            />

            <EvolutionChart simulation={simulation} />

            <Tumor3DView
              simulation={simulation}
              activeTime={activeTime}
              setActiveTime={setActiveTime}
            />

            <ClosedLoop
              simulation={simulation}
              cancer={cancer}
              selectedTargets={selectedTargets}
              setSelectedTargets={setSelectedTargets}
            />

            <MonitoringPanel />

            <EvidenceGate />

            <Panel tone="slate">
              <div className="flex flex-col justify-between gap-4 md:flex-row md:items-center">
                <div>
                  <h2 className="display text-xl font-semibold text-slate-900">Download Current Simulation</h2>
                  <p className="mt-1 text-sm text-slate-600">
                    Save the selected settings and simulated output as a JSON file for your project demonstration.
                  </p>
                </div>

                <button
                  onClick={downloadReport}
                  className="rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50"
                >
                  Download JSON Report
                </button>
              </div>
            </Panel>
          </main>

          <footer className="border-t border-slate-200 bg-white px-4 py-7 text-center text-sm text-slate-500">
            <strong className="text-slate-700">NEOIMMUNE AI Lab</strong> • Educational simulation prototype •
            Simulated data only • No patient data • No medical advice • Independent laboratory, clinical, ethical,
            and regulatory validation required.
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
